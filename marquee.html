<html>
<style>
   .text{
         background: linear-gradient(to top, #ffcce4 2%, #ffcce4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke-width: 0.5px;
        -webkit-text-stroke-color: #d6ffcc;
   }
       .text {
      animation: jerky 0.5s infinite;
    }

    @keyframes jerky {
      0% {
        transform: rotate(1deg);
      }

      50% {
        transform: rotate(1deg);
      }

      51% {
        transform: rotate(-1deg);
      }

      100% {
        transform: rotate(-1deg);
      }
    }
      </style>
      <p class="text">ㅤㅤIt'sㅤcrazy,ㅤbutㅤit'sㅤtrueㅤ❤︎ଂㅤIㅤonlyㅤwantㅤtoㅤbeㅤwith youㅤㅤ</p>

</html>
